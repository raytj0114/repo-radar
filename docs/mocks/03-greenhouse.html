<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>温室 — RepoRadar Greenhouse (MOCK 03)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     温室 — 「追う」を「見守る」に変える。
     各リポジトリは植物。姿は名前から決定論的に生成され、
     最終リリースからの時間で 新芽→健やか→彩度が落ち→石化 と変わる。
     光は閲覧者の現在時刻に連動する。動きはCSSだけ(そよぎと結露)。
     ============================================================ */
  :root {
    --ink: #3c4a3f;
    --paper: #fbfaf4;
    --board: #cfd8c6;
    --board-edge: #aab89f;
  }
  html.t-night { --ink: #cfe0d4; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    overflow-x: hidden;
  }

  /* ---- 空(現在時刻の光) ---- */
  .sky { position: fixed; inset: 0; z-index: -3; transition: background 3s; }
  .t-dawn .sky { background: linear-gradient(180deg, #ffd9b8 0%, #cfdde8 70%, #e8eee4 100%); }
  .t-day .sky { background: linear-gradient(180deg, #cfe6f2 0%, #e6f1ec 70%, #eef4ea 100%); }
  .t-dusk .sky { background: linear-gradient(180deg, #f4b98a 0%, #a9b4d0 70%, #8ba4b8 100%); }
  .t-night .sky {
    background:
      radial-gradient(160px 160px at 78% 16%, rgba(240, 244, 230, 0.35), transparent 65%),
      linear-gradient(180deg, #14203a 0%, #0a1224 70%, #070d1a 100%);
  }
  .shaft {
    position: fixed; inset: -20%; z-index: -2; pointer-events: none;
    background: linear-gradient(112deg, transparent 30%, rgba(255, 248, 220, 0.5) 46%, transparent 60%);
    opacity: 0; transition: opacity 3s;
  }
  .t-dawn .shaft { opacity: 0.4; }
  .t-day .shaft { opacity: 0.14; }
  .t-dusk .shaft { opacity: 0.3; }
  .growlamp {
    position: fixed; inset: 0 0 auto 0; height: 40vh; z-index: -2; pointer-events: none;
    background: linear-gradient(180deg, rgba(196, 130, 255, 0.16), transparent);
    opacity: 0; transition: opacity 3s;
  }
  .t-night .growlamp { opacity: 1; }

  /* ---- ガラス(桟と結露) ---- */
  .glass {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, rgba(245, 250, 246, 0.55) 0 2px, transparent 2px 190px),
      repeating-linear-gradient(0deg, rgba(245, 250, 246, 0.45) 0 2px, transparent 2px 230px),
      linear-gradient(180deg, rgba(214, 236, 226, 0.12), rgba(214, 236, 226, 0.05));
  }
  .t-night .glass {
    background:
      repeating-linear-gradient(90deg, rgba(120, 140, 150, 0.35) 0 2px, transparent 2px 190px),
      repeating-linear-gradient(0deg, rgba(120, 140, 150, 0.3) 0 2px, transparent 2px 230px),
      linear-gradient(180deg, rgba(30, 50, 60, 0.2), rgba(30, 50, 60, 0.08));
  }
  .drop {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: -1;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.75), rgba(230, 245, 240, 0.22) 70%);
    opacity: 0.25; transition: opacity 3s;
  }
  .t-dawn .drop, .t-night .drop { opacity: 0.7; }
  .runnel {
    position: fixed; width: 2.5px; height: 46px; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.55));
    border-radius: 2px; opacity: 0; animation: run 14s linear infinite;
  }
  .t-dawn .runnel, .t-night .runnel { opacity: 0.6; }
  @keyframes run { from { transform: translateY(-10vh); } to { transform: translateY(105vh); } }

  /* ---- 棚 ---- */
  .plaque { text-align: center; padding: 26px 12px 6px; }
  .plaque h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 0.6em; text-indent: 0.6em; }
  .plaque p { margin: 4px 0 0; font-size: 10px; letter-spacing: 0.35em; opacity: 0.55; }
  .house { max-width: 860px; margin: 0 auto; padding: 6px 14px 30px; }
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    row-gap: 30px; column-gap: 0;
    margin-top: 14px;
  }
  .pot-cell {
    appearance: none; background: none; border: none; cursor: pointer;
    font: inherit; color: inherit;
    padding: 0 8px 12px;
    position: relative;
  }
  .pot-cell::after {                              /* 白緑に塗られた棚板(隣と連結) */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
    background: linear-gradient(180deg, var(--board), var(--board-edge));
    box-shadow: 0 2px 3px rgba(60, 80, 60, 0.25);
  }
  .pot-cell svg { width: 100%; height: auto; display: block; }
  .cellname {
    font-size: 10px; opacity: 0.6; letter-spacing: 0.04em;
    margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .t-night .shelf svg { filter: brightness(0.78) saturate(0.9); }
  .t-dusk .shelf svg { filter: brightness(0.94) sepia(0.08); }

  .plant {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: sway var(--sd, 5s) ease-in-out var(--sdel, 0s) infinite alternate;
  }
  .st-stone .plant { animation: none; }
  @keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.7deg); } }

  /* ---- ガラスの外(野の花 = トレンド) ---- */
  .outside { margin-top: 44px; border-top: 2px solid rgba(160, 180, 160, 0.5); padding-top: 6px; }
  .outside .cap { font-size: 10.5px; letter-spacing: 0.3em; opacity: 0.55; text-align: center; }
  .meadow { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin-top: 8px; }
  .wild { text-align: center; width: 92px; }
  .wild svg { width: 54px; height: 64px; }
  .wild .wname { font-size: 9.5px; opacity: 0.6; overflow-wrap: anywhere; line-height: 1.4; }

  footer { text-align: center; font-size: 9.5px; letter-spacing: 0.2em; opacity: 0.5; padding: 26px 12px 30px; }

  /* ---- 園芸札(タップで開く) ---- */
  .backdrop {
    position: fixed; inset: 0; background: rgba(30, 40, 30, 0.35);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .backdrop.open { display: flex; }
  .tag-card {
    width: min(88vw, 380px);
    background: var(--paper); color: #3c4a3f;
    border-radius: 14px; padding: 20px 22px 18px;
    box-shadow: 0 12px 40px rgba(20, 30, 20, 0.4);
    position: relative;
  }
  .tag-card::before {                             /* 土に挿すマーカーの脚 */
    content: ""; position: absolute; left: 50%; top: -14px; width: 10px; height: 18px;
    margin-left: -5px; background: var(--paper); border-radius: 4px 4px 0 0;
  }
  .tag-card h2 { margin: 0; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .tag-card .kind { font-size: 11.5px; opacity: 0.65; margin-top: 2px; }
  .tag-card .staterow { display: flex; gap: 10px; align-items: baseline; margin-top: 12px; font-size: 12.5px; }
  .badge { border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 10px; font-size: 11px; }
  .b-fresh { color: #4d8f3f; } .b-ok { color: #5c7a52; } .b-dull { color: #8a8a6a; } .b-stone { color: #7d8286; }
  .tag-card .record { margin-top: 12px; border-top: 1px dashed #cfcab4; padding-top: 10px; font-size: 12.5px; line-height: 1.9; }
  .tag-card .record .rl { margin: 0; }
  .tag-card .norec { color: #8a8a76; }
  .closex {
    position: absolute; right: 12px; top: 10px; border: none; background: none;
    font-size: 16px; color: #8a9682; cursor: pointer; font-family: inherit;
  }

  @media (prefers-reduced-motion: reduce) {
    .plant, .runnel { animation: none; }
  }
</style>
</head>
<body class="t-day">
<div class="sky"></div>
<div class="shaft"></div>
<div class="growlamp"></div>
<div class="glass" id="glassLayer"></div>

<main class="house">
  <header class="plaque">
    <h1>温室</h1>
    <p>REPORADAR GREENHOUSE</p>
  </header>
  <section class="shelf" id="shelf" aria-label="鉢棚"></section>
  <section class="outside">
    <div class="cap">ガラスの外 ― 野の花</div>
    <div class="meadow" id="meadow"></div>
  </section>
  <footer id="foot">凍結データ 2026-07-31 21:00 JST ・ 光と風は現在時刻 ・ MOCK 03</footer>
</main>

<div class="backdrop" id="backdrop">
  <div class="tag-card" id="tagcard" role="dialog" aria-label="園芸札"></div>
</div>

<script>
'use strict';
/* ============================================================
   植木職人。data.json から鉢を並べる。
   捏造しないための境界:
   - 樹形は名前ハッシュのみ由来(リリース履歴が1件しかないため、
     「リリースごとに伸びる」は本実装の領分)
   - 開花 = タグが x.0.0 かつ 30日以内(モックの開花期。原案は7日)
   - 棘 = キャッシュ済み要約に「破壊的変更」の語が含まれる株
   - 状態 = 最終リリースからの経過(新芽7日/健やか180日/彩度365日/石化)
   ============================================================ */
const LANG_COLOR = { TypeScript: '#3178c6', JavaScript: '#f1e05a' };
const DAY = 86400000;
const state = { data: null, gen: 0 };

function fnv(s) {
  let h = 2166136261;
  for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PAL = {
  fresh: { stem: '#4a7c40', leaf: ['#5da24f', '#6fb35c', '#549a48'], tip: '#93d67e' },
  ok:    { stem: '#57734a', leaf: ['#6b9459', '#7aa365', '#628a52'], tip: null },
  dull:  { stem: '#7d8069', leaf: ['#8e9077', '#9a9c82', '#84866f'], tip: null },
  stone: { stem: '#8b8d8f', leaf: ['#989a9c', '#a3a5a7', '#8f9193'], tip: null },
};
function stateOf(days) {
  return days <= 7 ? 'fresh' : days <= 180 ? 'ok' : days <= 365 ? 'dull' : 'stone';
}
const STATE_LABEL = { fresh: '新芽', ok: '健やか', dull: '彩度が落ちている', stone: '石化' };

function rel(days, hours) {
  if (hours < 24) return `${Math.max(1, Math.round(hours))}時間前`;
  if (days < 60) return `${days}日前`;
  const m = Math.floor(days / 30.44);
  if (m < 12) return `${m}ヶ月前`;
  return `${Math.floor(m / 12)}年${m % 12 ? `${m % 12}ヶ月` : ''}前`;
}

/* ---- 葉。広葉(TypeScript) / 丸葉(JavaScript) ---- */
function leaf(x, y, ang, s, fill, lang) {
  const d = lang === 'JavaScript'
    ? `M0,0 q ${s * 0.5},${-s * 0.6} ${s},0 q ${-s * 0.5},${s * 0.6} ${-s},0`
    : `M0,0 Q ${s * 0.5},${-s * 0.34} ${s},0 Q ${s * 0.5},${s * 0.34} 0,0`;
  return `<path d="${d}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${ang.toFixed(0)})" fill="${fill}"/>`;
}
const qpt = (t, p0, c, p1) => (1 - t) * (1 - t) * p0 + 2 * (1 - t) * t * c + t * t * p1;

function plantSVG(ev) {
  const rng = mulberry32(fnv(ev.fullName));
  const days = Math.floor((state.gen - ev.cal) / DAY);
  const st = stateOf(days);
  const pal = PAL[st];
  const langColor = LANG_COLOR[ev.language] || '#b48ead';
  const breaking = !!(ev.summary && ev.summary.some((l) => l.includes('破壊的変更')));
  const major = /^v?\d+\.0\.0$/.test(ev.tagName);
  const bloom = major && days <= 30;

  const H = 58 + rng() * 34;
  const lean = (rng() - 0.5) * 16;
  const tipX = 60 + lean, tipY = 118 - H;
  const cX = 60 + (rng() - 0.5) * 14, cY = 118 - H * 0.45;
  const droop = st === 'dull' ? 16 : st === 'stone' ? 26 : 0;
  let p = `<path d="M60,118 Q${cX.toFixed(1)},${cY.toFixed(1)} ${tipX.toFixed(1)},${tipY.toFixed(1)}"
    stroke="${pal.stem}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;

  const nb = 2 + Math.floor(rng() * 3);
  for (let i = 0; i < nb; i++) {
    const f = 0.32 + rng() * 0.44;
    const bx = qpt(f, 60, cX, tipX), by = qpt(f, 118, cY, tipY);
    const side = i % 2 ? 1 : -1;
    const ang = (-72 + rng() * 30 + droop) * (Math.PI / 180);
    const len = 15 + rng() * 13;
    const ex = bx + Math.cos(ang) * len * side, ey = by + Math.sin(ang) * len;
    p += `<path d="M${bx.toFixed(1)},${by.toFixed(1)} Q${((bx + ex) / 2 + side * 3).toFixed(1)},${(by - 4).toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}"
      stroke="${pal.stem}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    const lf = pal.leaf[Math.floor(rng() * pal.leaf.length)];
    p += leaf(ex, ey, side > 0 ? -30 + droop : 210 - droop, 11 + rng() * 5, lf, ev.language);
    if (rng() > 0.4) {
      p += leaf((bx + ex) / 2, (by + ey) / 2, side > 0 ? -58 + droop : 238 - droop, 8 + rng() * 4, pal.leaf[Math.floor(rng() * 3)], ev.language);
    }
  }

  if (breaking) {           // 棘: 要約に「破壊的変更」を含む株
    for (const f of [0.3, 0.5, 0.7, 0.88]) {
      const x = qpt(f, 60, cX, tipX), y = qpt(f, 118, cY, tipY);
      const side = f * 100 % 2 > 1 ? 1 : -1;
      p += `<path d="M0,0 L${6 * side},-2.4 L0,-4.4 Z" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" fill="#5c5346"/>`;
    }
  }
  if (bloom) {              // 開花: メジャーは言語色の花を咲かせる
    let petals = '';
    for (let k = 0; k < 6; k++) {
      petals += `<ellipse cx="0" cy="-7.5" rx="4" ry="7.5" fill="${langColor}" transform="rotate(${k * 60})"/>`;
    }
    p += `<g transform="translate(${tipX.toFixed(1)},${(tipY - 3).toFixed(1)})">${petals}<circle r="3.4" fill="#8a6d3b"/></g>`;
  } else if (pal.tip) {     // 新芽: 明るい葉先
    p += leaf(tipX, tipY, -80, 9, pal.tip, ev.language);
    p += leaf(tipX, tipY, -140, 8, pal.tip, ev.language);
  } else {
    p += leaf(tipX, tipY, -100 + droop, 10, pal.leaf[0], ev.language);
  }
  if (st === 'stone') {     // 石化した株は苔をまとう
    for (let i = 0; i < 4; i++) {
      const f = 0.2 + rng() * 0.6;
      p += `<ellipse cx="${qpt(f, 60, cX, tipX).toFixed(1)}" cy="${qpt(f, 118, cY, tipY).toFixed(1)}"
        rx="${(3.5 + rng() * 3).toFixed(1)}" ry="${(2.5 + rng() * 2).toFixed(1)}" fill="#9fae66" opacity="0.85"/>`;
    }
  }

  const potHue = 18 + rng() * 14;
  const sway = `--sd:${(4.5 + rng() * 3).toFixed(1)}s;--sdel:${(-rng() * 5).toFixed(1)}s`;
  const shortName = ev.fullName.split('/')[1];
  const tagText = shortName.length > 9 ? shortName.slice(0, 8) + '…' : shortName;
  return `<svg viewBox="0 0 120 156" role="img" aria-label="${ev.fullName}">
    <g class="plant" style="${sway}">${p}</g>
    <ellipse cx="60" cy="119" rx="21" ry="4.5" fill="#4a3a2c"/>
    <path d="M37,117 h46 l-1,7 h-44 z" fill="hsl(${potHue},48%,52%)"/>
    <path d="M40,125 L80,125 L76,150 L44,150 Z" fill="hsl(${potHue},45%,46%)"/>
    <g transform="translate(80,130) rotate(9)">
      <rect x="-1.6" y="-22" width="3.2" height="24" fill="#e9e5d6"/>
      <rect x="-15" y="-36" width="30" height="15" rx="2.5" fill="#f6f3e7" stroke="#d8d2bd"/>
      <text x="0" y="-25.5" text-anchor="middle" font-size="6.6" fill="#5a5a4a">${tagText}</text>
    </g>
  </svg>`;
}

function wildSVG(name, stars, maxStars) {
  const rng = mulberry32(fnv(name));
  const scale = 0.65 + (stars / maxStars) * 0.55;
  const hue = Math.floor(rng() * 360);
  let petals = '';
  for (let k = 0; k < 5; k++) {
    petals += `<ellipse cx="0" cy="-5.2" rx="2.8" ry="5.2" fill="hsl(${hue},62%,72%)" transform="rotate(${k * 72})"/>`;
  }
  return `<svg viewBox="0 0 60 70"><g transform="translate(30,66) scale(${scale.toFixed(2)})">
    <path d="M0,0 Q${(rng() - 0.5) * 8},-18 0,-34" stroke="#7c9668" stroke-width="2" fill="none"/>
    ${leaf(0, -14, rng() > 0.5 ? -30 : 210, 8, '#88a873', 'TypeScript')}
    <g transform="translate(0,-36)">${petals}<circle r="2.4" fill="hsl(${hue},50%,45%)"/></g>
  </g></svg>`;
}

/* ---- 現在時刻の光(?hour=NN で任意の時刻を試せる) ---- */
function lightOfDay() {
  const q = new URLSearchParams(location.search).get('hour');
  const h = q !== null ? +q : new Date().getHours();
  const cls = h >= 5 && h < 8 ? 't-dawn' : h >= 8 && h < 16 ? 't-day' : h >= 16 && h < 20 ? 't-dusk' : 't-night';
  document.documentElement.className = cls;
  document.body.className = cls;
}
lightOfDay();
setInterval(lightOfDay, 60000);

/* ---- 結露(種は固定。位置は毎回同じ) ---- */
(function dew() {
  const rng = mulberry32(fnv('glass-dew'));
  let html = '';
  for (let i = 0; i < 42; i++) {
    const s = 2.5 + rng() * 4;
    html += `<div class="drop" style="left:${(rng() * 98).toFixed(1)}vw;top:${(rng() * 92).toFixed(1)}vh;width:${s.toFixed(1)}px;height:${(s * 1.15).toFixed(1)}px"></div>`;
  }
  for (let i = 0; i < 2; i++) {
    html += `<div class="runnel" style="left:${(12 + rng() * 76).toFixed(1)}vw;animation-delay:${(-rng() * 14).toFixed(1)}s"></div>`;
  }
  document.body.insertAdjacentHTML('beforeend', html);
})();

/* ---- 園芸札 ---- */
const backdrop = document.getElementById('backdrop');
const tagcard = document.getElementById('tagcard');
function openTag(ev) {
  const hours = (state.gen - ev.cal) / 3600000;
  const days = Math.floor(hours / 24);
  const st = stateOf(days);
  const record = ev.summary
    ? ev.summary.map((l) => `<p class="rl">${l}</p>`).join('')
    : '<p class="rl norec">記録は残っていない。</p>';
  tagcard.innerHTML =
    `<button class="closex" aria-label="閉じる">×</button>` +
    `<h2>${ev.fullName}</h2>` +
    `<div class="kind">${ev.language} ／ ${ev.tagName}</div>` +
    `<div class="staterow"><span class="badge b-${st}">${STATE_LABEL[st]}</span>` +
    `<span>最後の便り: ${rel(days, hours)}</span></div>` +
    `<div class="record">${record}</div>`;
  backdrop.classList.add('open');
}
backdrop.addEventListener('click', (ev) => {
  if (ev.target === backdrop || ev.target.closest('.closex')) backdrop.classList.remove('open');
});
addEventListener('keydown', (ev) => { if (ev.key === 'Escape') backdrop.classList.remove('open'); });

/* ---- 植える ---- */
fetch('./data.json')
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    state.data = data;
    state.gen = new Date(data.generatedAt).getTime();
    const favs = data.favorites.map((f) => ({ ...f, cal: new Date(f.publishedAt).getTime() }));

    document.getElementById('shelf').innerHTML = favs.map((ev, i) => {
      const days = Math.floor((state.gen - ev.cal) / DAY);
      return `<button class="pot-cell st-${stateOf(days)}" data-i="${i}" aria-label="${ev.fullName} の園芸札を見る">
        ${plantSVG(ev)}<div class="cellname">${ev.fullName}</div>
      </button>`;
    }).join('');
    document.getElementById('shelf').addEventListener('click', (ev) => {
      const cell = ev.target.closest('.pot-cell');
      if (cell) openTag(favs[+cell.dataset.i]);
    });

    const maxStars = Math.max(...data.trending.map((t) => t.stars));
    document.getElementById('meadow').innerHTML = data.trending.map((tr) =>
      `<div class="wild">${wildSVG(tr.fullName, tr.stars, maxStars)}
        <div class="wname">${tr.fullName}<br>★${tr.stars.toLocaleString('ja-JP')}</div>
      </div>`).join('');
  })
  .catch(() => {
    document.getElementById('shelf').innerHTML =
      '<p style="grid-column:1/-1;text-align:center;font-size:13px;opacity:0.7">' +
